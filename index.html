<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>磁悬浮地球仪控制台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：三维场景铺满整页，像一件悬浮在深空里的展品。左上是标题、状态和读数；右上是速度、视角等开关；
   右侧是可收起的参数面板（示波器 + PID）；底部中间是讲解字幕和实验按钮；负反馈环框图按需弹出。
   整页固定为深色：面板是深色半透明玻璃，强调色取自实物——线圈的紫铜色和磁感线的青蓝色。 */
:root{
  --paper:#03050a; --panel:#0d141f; --ink:#e7edf6; --muted:#8e9bb0; --line:#24324a; --grid:#111a27;
  --copper:#e08a4c; --glow:#ffae63; --steel:#8b98ab; --field:#5aa8ff; --cyan:#62d4ff;
  --ocean:#2f6fb5; --land:#5c9a55; --brass:#cfa640;
  --t-x:#86b8ff; --t-i:#f2a06a; --t-v:#46d1bd;
  --ok:#4ad38c; --warn:#f1b552; --bad:#ff6d6d;
  --font-ui:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --font-num:"JetBrains Mono","Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  --rp:400px;
  --gap:14px;
  --dock-h:120px;      /* 底部字幕 + 按钮的实际高度，由脚本测量后更新 */
  --edge-l:max(16px,env(safe-area-inset-left,0px));
  --edge-r:max(16px,env(safe-area-inset-right,0px));
  --edge-t:calc(14px + env(safe-area-inset-top,0px));
  --edge-b:calc(14px + env(safe-area-inset-bottom,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* 带 hidden 属性的元素一律不显示，否则下面的 display 会把它顶出来 */
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5}
.panel-closed{--rp:0px}
.app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 40% 35%,#0a1222,#03050a 70%)}

/* 场景 */
.stage3d{position:absolute;inset:0}
.stage3d canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
.stage3d canvas.gl:active{cursor:grabbing}
.stage3d canvas.gl:focus{outline:none}
#stage{position:absolute;left:calc((100% - var(--rp)) / 2);top:calc(50% - 60px);transform:translate(-50%,-50%);display:block}

/* 深色玻璃浮层 */
.glass{background:linear-gradient(180deg,rgba(22,32,50,.62),rgba(9,14,24,.58));backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid rgba(140,175,230,.16);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.lowfx .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(11,17,28,.92)}
.hud{position:absolute;z-index:3}
.eyebrow{margin:0 0 4px;font-family:var(--font-num);font-size:10.5px;letter-spacing:.18em;color:var(--cyan);opacity:.85}
h1{font-size:20px;line-height:1.25;font-weight:600;letter-spacing:.06em;margin:0;text-wrap:balance}
.sub{margin:3px 0 0;color:var(--muted);font-size:12.5px}
h2{font-size:11.5px;font-weight:600;letter-spacing:.14em;color:var(--muted);margin:0 0 8px}
kbd{font-family:var(--font-num);font-size:10.5px;line-height:1;padding:3px 5px;border:1px solid rgba(140,175,230,.22);border-radius:4px;color:var(--muted)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* 左上：标题、状态、读数 */
.hud-tl{left:var(--edge-l);top:var(--edge-t);width:min(340px,calc(100vw - 32px));padding:14px 16px 12px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);background:rgba(142,155,176,.12)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.pill.ok{color:var(--ok);background:rgba(74,211,140,.12)}
.pill.warn{color:var(--warn);background:rgba(241,181,82,.13)}
.pill.bad{color:var(--bad);background:rgba(255,109,109,.13)}
.readouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(140,175,230,.14)}
.ro span{display:block;font-size:11.5px;color:var(--muted)}
.ro output{display:block;font-family:var(--font-num);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{margin:10px 0 0;font-size:11.5px;color:var(--muted)}
.low-fps{display:block;margin-top:6px;font-size:12px;color:var(--warn)}

/* 右上：开关 */
.hud-tr{right:var(--edge-r);top:var(--edge-t);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:calc(100vw - 32px - min(340px,100vw - 32px) - 16px)}
.seg{display:inline-flex;overflow:hidden;border-radius:10px}
.seg button{font:inherit;font-size:13px;padding:6px 11px;border:0;border-right:1px solid rgba(140,175,230,.14);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button:last-child{border-right:0}
.seg button:hover{background:rgba(255,255,255,.05)}
.seg button[aria-pressed="true"]{background:rgba(98,212,255,.16);color:var(--cyan)}
.seg button[aria-pressed="true"] kbd{color:var(--cyan);border-color:rgba(98,212,255,.4)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
button.act{font:inherit;font-size:13.5px;padding:7px 12px;border-radius:10px;border:1px solid rgba(140,175,230,.18);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
button.act:hover{border-color:rgba(140,175,230,.42);background:rgba(255,255,255,.07)}
button.act[aria-pressed="true"]{background:rgba(98,212,255,.16);color:var(--cyan);border-color:rgba(98,212,255,.5)}
button.act[aria-pressed="true"] kbd{color:var(--cyan);border-color:rgba(98,212,255,.4)}
button.act.risky[aria-pressed="true"]{background:rgba(255,109,109,.18);color:#ffb7b7;border-color:rgba(255,109,109,.6)}
button.act.risky[aria-pressed="true"] kbd{color:#ffb7b7;border-color:rgba(255,109,109,.5)}

/* 右侧：参数面板 */
.hud-right{right:var(--edge-r);top:calc(var(--edge-t) + var(--tr-h,40px) + 12px);bottom:var(--edge-b);width:min(var(--rp),calc(100vw - 32px));padding:14px 16px;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:16px;transition:opacity .25s,transform .25s}
.panel-closed .hud-right{opacity:0;transform:translateX(24px);pointer-events:none;visibility:hidden}
.hud-right section+section{border-top:1px solid rgba(140,175,230,.14);padding-top:14px}
.scope-legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12px;color:var(--muted);margin:-2px 0 6px}
.scope-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.scope-legend i.dash{height:0;border-top:2px dashed rgba(231,237,246,.85);border-radius:0}
/* 电路对照：三档开关和状态 */
.circ-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 6px}
.circ-row .seg{border:1px solid rgba(140,175,230,.18)}
.circ-row .seg button{font-size:12.5px;padding:5px 10px}
.circ-status{margin:0 0 8px;font-size:12px;color:var(--muted);min-height:1.5em}
.circ-status.ok{color:var(--ok)}
.circ-status.warn{color:var(--warn)}
.circ-status.bad{color:var(--bad)}
canvas{display:block;max-width:100%}
#scope,#map{width:100%}
.knob{display:grid;grid-template-columns:70px minmax(0,1fr) 62px;gap:2px 10px;align-items:center;padding:6px 0}
.knob+.knob{border-top:1px dashed rgba(140,175,230,.14)}
.knob label{font-weight:600}
.knob label small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.knob input{width:100%;accent-color:var(--copper)}
.knob output{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.knob .res{grid-column:2 / 4;font-family:var(--font-num);font-size:11.5px;color:var(--muted)}
.map-cap{font-size:11.5px;color:var(--muted);margin:6px 0 0}
.poles{font-family:var(--font-num);font-size:12px;margin:4px 0 0;font-variant-numeric:tabular-nums}

/* 底部：讲解字幕 + 实验按钮，在右侧面板左边的空间里居中 */
.dock{position:absolute;z-index:3;left:var(--edge-l);right:calc(var(--edge-r) + var(--rp) + var(--gap));bottom:var(--edge-b);
  display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;transition:right .25s}
.dock>*{pointer-events:auto}
.explain{display:flex;gap:12px;align-items:flex-start;margin:0;padding:10px 16px;max-width:min(820px,100%);font-size:14.5px}
.explain b{flex:none;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--copper);padding-top:2px}
.toolbar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px;max-width:100%}
.toolbar .sep{width:1px;align-self:stretch;background:rgba(140,175,230,.16);margin:2px 4px}

/* 负反馈环框图，按需弹出在底部按钮上方 */
.loop-pop{position:absolute;z-index:4;left:var(--edge-l);right:calc(var(--edge-r) + var(--rp) + var(--gap));bottom:calc(var(--edge-b) + var(--dock-h) + 10px);
  margin:0 auto;max-width:1080px;padding:12px 16px 10px;transition:right .25s}
.loop-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.loop-head h2{margin:0}
.loop-scroll{overflow-x:auto}
.loop-scroll svg{display:block;min-width:820px;width:100%;height:auto}
svg .blk rect{fill:rgba(13,20,31,.85);stroke:rgba(140,175,230,.22);stroke-width:1.4}
svg .blk.hot rect{stroke:var(--copper);stroke-width:2}
svg .blk.sat rect{stroke:var(--warn);stroke-width:2}
svg .blk.bad rect{stroke:var(--bad);stroke-width:2.2}
svg .blk.dim{opacity:.45}
svg .ttl{fill:var(--ink);font-size:15px;font-weight:700}
svg .tag{fill:var(--muted);font-size:11.5px}
svg .val{fill:var(--ink);font-family:var(--font-num);font-size:12.5px}
svg .lbl{fill:var(--muted);font-family:var(--font-num);font-size:12px}
svg .sign{fill:var(--ink);font-size:15px;font-weight:700}
svg .wire{fill:none;stroke:var(--field);stroke-width:1.6;opacity:.75}
svg .flow{stroke-dasharray:6 6;animation:dash 0.9s linear infinite}
svg .wire.cut{stroke:var(--bad);animation:none;stroke-dasharray:3 4;opacity:1}
svg .wire.off{opacity:.25;animation:none}
svg .sum{fill:rgba(13,20,31,.85);stroke:var(--ink);stroke-width:1.6}
svg .ah{fill:var(--field)}
svg .dsym{fill:none;stroke:var(--muted);stroke-width:1.6}
svg .blk.on .dsym{stroke:var(--glow);fill:rgba(255,174,99,.35)}
svg .cutmark{fill:var(--bad);font-size:13px;font-weight:700}
@keyframes dash{to{stroke-dashoffset:-24}}

/* 三维标注 */
.labels3d{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.labels3d.off{display:none}
.l3{position:absolute;left:0;top:0;width:0;height:0}
.l3 i{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.l3 span{position:absolute;white-space:nowrap;font-size:12.5px;line-height:1.3;padding:3px 9px;border-radius:7px;background:rgba(9,14,24,.72);border:1px solid rgba(140,175,230,.22);color:var(--ink);font-variant-numeric:tabular-nums}
.l3.up span{left:0;bottom:11px;transform:translateX(-50%)}
.l3.left span{right:11px;top:0;transform:translateY(-50%)}
.l3.right span{left:11px;top:0;transform:translateY(-50%)}

/* 窄屏：参数面板改成整宽浮层，默认收起 */
@media (max-width:820px){
  :root{--rp:0px}
  .hud-tl{width:min(300px,calc(100vw - 32px));padding:10px 12px}
  .hud-tl .sub,.hud-tl .hint,.eyebrow{display:none}
  h1{font-size:16px}
  .ro output{font-size:14px}
  /* 开关改成底部按钮上方可以横向滑动的一行 */
  .hud-tr{top:auto;left:var(--edge-l);right:var(--edge-r);bottom:calc(var(--edge-b) + var(--dock-h) + 8px);max-width:none;
    flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .hud-tr>*{flex:none}
  .hud-right{left:var(--edge-l);width:auto;top:calc(var(--edge-t) + 120px);bottom:calc(var(--edge-b) + var(--dock-h) + 56px)}
  .explain{font-size:13px;padding:8px 12px}
  .toolbar button.act{padding:6px 9px;font-size:12.5px}
  .toolbar kbd,.hud-tr kbd{display:none}
  .loop-pop{bottom:calc(var(--edge-b) + var(--dock-h) + 56px)}
}
@media (prefers-reduced-motion:reduce){svg .flow{animation:none}.hud-right,.dock,.loop-pop{transition:none}}
</style>

<div class="app" id="app">
  <div class="stage3d" id="stage3d">
    <div class="labels3d" id="labels3d" aria-hidden="true"></div>
  </div>
  <canvas id="stage" hidden aria-label="电磁铁吸住地球仪的平面动画，间隙放大显示"></canvas>

  <section class="hud hud-tl glass" aria-label="状态和读数">
    <p class="eyebrow">MAGLEV · ANALOG PID</p>
    <h1>磁悬浮地球仪控制台</h1>
    <p class="sub">电路与模拟电子技术 · 期末项目演示</p>
    <div class="pills">
      <span class="pill ok" id="status">稳定悬浮</span>
      <span class="pill" id="theory">理论：稳定</span>
    </div>
    <div class="readouts">
      <div class="ro"><span>间隙 x</span><output id="r-x">10.00 mm</output></div>
      <div class="ro"><span>偏离目标</span><output id="r-dx">+0.00 mm</output></div>
      <div class="ro"><span>线圈电流</span><output id="r-i">0.600 A</output></div>
      <div class="ro"><span>线圈电压</span><output id="r-v">6.00 V</output></div>
      <div class="ro"><span>功率管发热</span><output id="r-p">3.6 W</output></div>
    </div>
    <p class="hint">拖动旋转；点一下场景后可用滚轮缩放；双击回到斜视。间隙变化放大约 3 倍显示。</p>
    <span class="low-fps" id="fps-hint" hidden></span>
  </section>

  <div class="hud hud-tr">
    <div class="seg glass" id="speed" role="group" aria-label="仿真速度">
      <button type="button" data-speed="1" aria-pressed="false">实时 <kbd>1</kbd></button>
      <button type="button" data-speed="0.25" aria-pressed="true">慢放 4× <kbd>2</kbd></button>
      <button type="button" data-speed="0.1" aria-pressed="false">慢放 10× <kbd>3</kbd></button>
      <button type="button" data-speed="0" aria-pressed="false">暂停 <kbd>P</kbd></button>
    </div>
    <div class="seg glass" id="views" role="group" aria-label="视角">
      <button type="button" data-view="angle" aria-pressed="true">斜视</button>
      <button type="button" data-view="front" aria-pressed="false">正面</button>
      <button type="button" data-view="board" aria-pressed="false">电路板</button>
    </div>
    <button type="button" class="act glass" id="b-labels" aria-pressed="true">标注</button>
    <div class="seg glass" id="modes" role="group" aria-label="显示方式">
      <button type="button" data-mode="3d" aria-pressed="true">三维</button>
      <button type="button" data-mode="2d" aria-pressed="false">平面</button>
    </div>
    <button type="button" class="act glass" id="b-panel" aria-pressed="true" aria-controls="panel">参数面板 <kbd>H</kbd></button>
  </div>

  <aside class="hud hud-right glass" id="panel" aria-label="示波器和 PID 参数">
    <section aria-label="示波器">
      <h2 id="scope-title">示波器 · 最近 2 秒</h2>
      <div class="circ-row">
        <div class="seg" id="circ-mode" role="group" aria-label="电路对照">
          <button type="button" data-circ="off" aria-pressed="true">不对照</button>
          <button type="button" data-circ="stored" aria-pressed="false">预存电路</button>
          <button type="button" data-circ="live" aria-pressed="false">实时电路</button>
        </div>
        <button type="button" class="act small" id="b-redo" hidden>重做并对照 <kbd>C</kbd></button>
      </div>
      <p class="circ-status" id="circ-status" aria-live="polite"></p>
      <div class="scope-legend">
        <span><i style="background:var(--t-x)"></i>间隙 x（mm）</span>
        <span><i style="background:var(--t-i)"></i>电流 i（A）</span>
        <span><i style="background:var(--t-v)"></i>电压 V（V）</span>
        <span id="lg-circ" hidden><i class="dash"></i>电路仿真（LTspice）</span>
      </div>
      <canvas id="scope" aria-label="间隙、电流、电压随时间变化的曲线"></canvas>
    </section>
    <section aria-label="PID 参数">
      <h2>PID 参数 · 拧旋钮就是换电阻</h2>
      <div class="knob">
        <label for="kp">比例 Kp<small>托住的力度</small></label>
        <input type="range" id="kp" min="0" max="10" step="0.1">
        <output id="kp-o"></output>
        <div class="res" id="kp-r"></div>
      </div>
      <div class="knob">
        <label for="ki">积分 Ki<small>消除偏差</small></label>
        <input type="range" id="ki" min="0" max="200" step="1">
        <output id="ki-o"></output>
        <div class="res" id="ki-r"></div>
      </div>
      <div class="knob">
        <label for="kd">微分 Kd<small>阻尼，防晃</small></label>
        <input type="range" id="kd" min="0" max="0.15" step="0.001">
        <output id="kd-o"></output>
        <div class="res" id="kd-r"></div>
      </div>
      <canvas id="map" aria-label="Kp 与 Kd 平面上的稳定区域和当前参数点"></canvas>
      <p class="map-cap">绿色区域：简化模型按劳斯判据算出的稳定区。圆点是当前参数。</p>
      <p class="poles" id="poles"></p>
    </section>
  </aside>

  <section class="hud loop-pop glass" id="loop" hidden aria-label="负反馈环">
    <div class="loop-head">
      <h2>负反馈环 · 每一块对应一个课程知识点</h2>
      <button type="button" class="act" id="b-loop-close">收起 <kbd>L</kbd></button>
    </div>
    <div class="loop-scroll">
      <svg viewBox="0 0 1040 244" role="img" aria-label="设定高度、减法器、PID、驱动级、线圈、电磁力、小球、霍尔传感器组成的负反馈环">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="ah" d="M0 0 L10 5 L0 10 z"></path>
          </marker>
        </defs>
        <path class="wire flow" d="M144 63 H165" marker-end="url(#ah)"></path>
        <path class="wire flow" d="M201 63 H224" marker-end="url(#ah)"></path>
        <path class="wire flow" d="M412 63 H446" marker-end="url(#ah)"></path>
        <path class="wire flow" id="w-drv" d="M634 63 H668" marker-end="url(#ah)"></path>
        <path class="wire" d="M856 46 H872 M856 80 H872"></path>
        <path class="wire flow" d="M763 102 V148" marker-end="url(#ah)"></path>
        <path class="wire flow" d="M670 189 H636" marker-end="url(#ah)"></path>
        <path class="wire flow" d="M448 189 H414" marker-end="url(#ah)"></path>
        <path class="wire flow" id="w-fb" d="M226 189 H184 V82" marker-end="url(#ah)"></path>
        <text class="lbl" x="424" y="56">u</text>
        <text class="lbl" x="640" y="56">i_cmd</text>
        <text class="lbl" x="771" y="130">i</text>
        <text class="lbl" x="646" y="182">F</text>
        <text class="lbl" x="424" y="182">x</text>
        <text class="lbl" x="192" y="182">y</text>

<script>
'use strict';
/* ===== 参数：必须与 model/params.json 保持一致 ===== */
// 优先用 data/params.js（由 model/params.json 自动生成）；找不到时用下面这份内置参数
const PARAMS = window.MAGLEV_PARAMS || {
  plant:{m_kg:0.05,g_m_per_s2:9.81,x0_m:0.010,i0_A:0.6,R_ohm:10.0,L_H:0.1,x_contact_m:0.003,x_lost_m:0.025,x_floor_m:0.045},
  sensor:{ks_V_per_m:100.0},
  driver:{Vs_V:12.0,Vsat_V:1.0,Vd_V:0.7,Gm_A_per_V:0.5,Kc_V_per_A:200.0,Vbreakdown_V:60.0},
  controller:{Kp:3.4,Ki_per_s:30.0,Kd_s:0.05,tau_f_s:0.001,u_min_V:-10.0,u_max_V:10.0},
  scenarios:{release_offset_m:0.002,push_force_N:0.3,push_duration_s:0.02,extra_mass_ratio:0.2}
};

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);

/* 派生量：文档第三节、第五节 */
function derive(P){
  const p=P.plant, d=P.driver, s=P.sensor;
  const k = p.m_kg*p.g_m_per_s2*p.x0_m*p.x0_m/(p.i0_A*p.i0_A);   // F = k·i²/x² 的常数
  const a = 2*p.g_m_per_s2/p.x0_m, b = 2*p.g_m_per_s2/p.i0_A;
  return { k, a, b, c: b*d.Gm_A_per_V*s.ks_V_per_m, Vbias: p.i0_A/d.Gm_A_per_V,
           yref: s.ks_V_per_m*p.x0_m, pole: Math.sqrt(a), Vhigh: d.Vs_V-d.Vsat_V };
}

/* ===== 仿真模型：状态 [x, v, i, z, w]，方程见文档第三、四节 ===== */
class Maglev {
  constructor(P){
    this.P=P; this.D=derive(P);
    const c=P.controller;
    this.gain={Kp:c.Kp, Ki:c.Ki_per_s, Kd:c.Kd_s};
    this.feedback=true; this.integral=true; this.diode=true;
    this.massRatio=0; this.noiseF=0; this.t=0; this.lastEventT=0;
    this.release();
  }
  err(x){ return this.P.sensor.ks_V_per_m*x - this.D.yref; }
  Vlow(){ const d=this.P.driver; return this.diode ? -d.Vd_V : -(d.Vbreakdown_V-d.Vs_V); }
  release(){
    const p=this.P.plant, x=p.x0_m+this.P.scenarios.release_offset_m;
    // 放手前手托着球、电流处于平衡值；微分滤波器从当前误差起步
    this.s={x, v:0, i:p.i0_A, z:0, w:this.err(x)};
    this.drive=true; this.damaged=false; this.spike=null; this.pushUntil=-1;
    this.out=this.f(this.s);
  }
  push(){ this.pushUntil=this.t+this.P.scenarios.push_duration_s; }
  f(s){
    const p=this.P.plant, d=this.P.driver, c=this.P.controller, g=this.gain;
    const e=this.err(s.x);                         // 误差 e = y − y_ref
    const dw=(e-s.w)/c.tau_f_s;                    // 微分滤波
    let u=0, dz=0;
    if(this.feedback){
      const I=this.integral ? g.Ki*s.z : 0;
      u=clamp(g.Kp*e + I + g.Kd*(e-s.w)/c.tau_f_s, c.u_min_V, c.u_max_V);
      if(this.integral){ dz=e; if((I>=c.u_max_V&&e>0)||(I<=c.u_min_V&&e<0)) dz=0; } // 防积分饱和
    }
    const icmd=(this.drive&&!this.damaged) ? Math.max(0, d.Gm_A_per_V*(this.D.Vbias+u)) : 0;
    let Vc=clamp(p.R_ohm*s.i + d.Kc_V_per_A*(icmd-s.i), this.Vlow(), this.D.Vhigh);
    let di=(Vc-p.R_ohm*s.i)/p.L_H;                 // L·di/dt = V − R·i
    if(s.i<=0 && di<0){ di=0; Vc=0; }              // 电流不能反向
    const m=p.m_kg*(1+this.massRatio);
    const F=this.D.k*s.i*s.i/(s.x*s.x);            // 电磁力
    const Fext=(this.t<this.pushUntil ? this.P.scenarios.push_force_N : 0) + this.noiseF;
    return {dx:s.v, dv:p.g_m_per_s2 - F/m + Fext/m, di, dz, dw, e, u, icmd, Vc, F, m};
  }
  step(h){
    const s=this.s, f=(st)=>this.f(st);
    const add=(k,sc)=>({x:s.x+k.dx*sc, v:s.v+k.dv*sc, i:s.i+k.di*sc, z:s.z+k.dz*sc, w:s.w+k.dw*sc});
    const k1=f(s), k2=f(add(k1,h/2)), k3=f(add(k2,h/2)), k4=f(add(k3,h));
    const r=(q)=>h/6*(k1[q]+2*k2[q]+2*k3[q]+k4[q]);
    const n={x:s.x+r('dx'), v:s.v+r('dv'), i:s.i+r('di'), z:s.z+r('dz'), w:s.w+r('dw')};
    const c=this.P.controller, p=this.P.plant;
    if(n.i<0) n.i=0;
    if(this.gain.Ki>0) n.z=clamp(n.z, c.u_min_V/this.gain.Ki, c.u_max_V/this.gain.Ki);
    if(n.x<=p.x_contact_m){ n.x=p.x_contact_m; if(n.v<0) n.v=0; }   // 被吸住
    if(n.x>=p.x_floor_m){ n.x=p.x_floor_m; if(n.v>0) n.v=0; }       // 落在底座上
    this.s=n; this.t+=h; this.out=this.f(n);
    if(!this.diode && !this.damaged && n.i>0.02 && this.out.Vc<=this.Vlow()+1e-6){
      this.damaged=true; this.spike={i:n.i, V:p.L_H*n.i/1e-6};   // 理论尖峰 L·Δi/Δt，Δt 取 1 µs
    }
  }
  get stuck(){ return this.s.x<=this.P.plant.x_contact_m+1e-9 && this.out.dv<=0; }
  get fallen(){ return this.s.x>this.P.plant.x_lost_m; }
}

/* 自检：不加噪声跑"放手"场景，用来和 Python 的 ref_release.csv 对照 */
window.maglevSelfTest = function(times=[0.005,0.01,0.02,0.05,0.1,0.2,0.3,0.5,1.0]){
  const m=new Maglev(PARAMS), h=1e-4, out=[];
  let k=0;
  for(const T of times){
    while(m.t < T-1e-9){ m.step(h); k++; }
    out.push({t:+m.t.toFixed(4), x_mm:+(m.s.x*1000).toFixed(4), i_A:+m.s.i.toFixed(4), V:+m.out.Vc.toFixed(3), u:+m.out.u.toFixed(4)});
  }
  return out;
};

});

/* ---------- 闭环极点（简化模型） ---------- */
function polyRoots(coef){ // Durand–Kerner，coef 从最高次开始
  const n=coef.length-1, a=coef.map(v=>v/coef[0]);
  const Rb=1+Math.max(...a.slice(1).map(Math.abs));
  let r=[]; for(let k=0;k<n;k++){ const th=2*Math.PI*k/n+0.4; r.push([Rb*Math.cos(th),Rb*Math.sin(th)]); }
  const mul=(p,q)=>[p[0]*q[0]-p[1]*q[1], p[0]*q[1]+p[1]*q[0]];
  const div=(p,q)=>{ const d=q[0]*q[0]+q[1]*q[1]||1e-30; return [(p[0]*q[0]+p[1]*q[1])/d,(p[1]*q[0]-p[0]*q[1])/d]; };
  for(let it=0;it<300;it++){
    for(let k=0;k<n;k++){
      let pv=[1,0]; for(let j=1;j<=n;j++) pv=[pv[0]*r[k][0]-pv[1]*r[k][1]+a[j], pv[0]*r[k][1]+pv[1]*r[k][0]];
      let den=[1,0]; for(let j=0;j<n;j++) if(j!==k) den=mul(den,[r[k][0]-r[j][0], r[k][1]-r[j][1]]);
      const q=div(pv,den); r[k]=[r[k][0]-q[0], r[k][1]-q[1]];
    }
  }
  return r;
}
function poleText(){
  const {a,c}=sim.D, g=sim.gain, Ki=sim.integral?g.Ki:0;
  if(!sim.feedback) return `开环极点：±${sim.D.pole.toFixed(1)} /s，其中 +${sim.D.pole.toFixed(1)} 在右半平面`;
  const roots = Ki>0 ? polyRoots([1, c*g.Kd, c*g.Kp-a, c*Ki]) : polyRoots([1, c*g.Kd, c*g.Kp-a]);
  const parts=[]; let zeta=null; const used=new Set();
  roots.sort((p,q)=>q[0]-p[0]);
  roots.forEach((p,k)=>{
    if(used.has(k)) return;
    if(Math.abs(p[1])>1e-6){
      const j=roots.findIndex((q,m)=>m!==k&&!used.has(m)&&Math.abs(q[0]-p[0])<1e-3*Math.max(1,Math.abs(p[0]))&&Math.abs(q[1]+p[1])<1e-3*Math.max(1,Math.abs(p[1])));
      if(j>=0) used.add(j);
      parts.push(`${sg(p[0],1)} ± j${Math.abs(p[1]).toFixed(1)}`);
      if(zeta===null) zeta=-p[0]/Math.hypot(p[0],p[1]);
    } else parts.push(sg(p[0],1));
    used.add(k);
  });
  return `闭环极点：${parts.join('，')} /s` + (zeta!==null?`　阻尼比 ζ ≈ ${zeta.toFixed(2)}`:'');
}
function theory(){
  const {a,c}=sim.D, g=sim.gain, Ki=sim.integral?g.Ki:0;
  if(!sim.drive||sim.damaged) return ['bad','理论：没有驱动电流'];
  if(!sim.feedback) return ['bad','理论：开环不稳定'];
  if(g.Kp<=a/c) return ['bad','理论：比例太小，不稳定'];
  if(g.Kd<=0) return Ki>0 ? ['bad','理论：没有微分，不稳定'] : ['warn','理论：临界，等幅振荡'];
  if(Ki>0 && Ki>=g.Kd*(c*g.Kp-a)) return ['bad','理论：积分太强或微分太弱，不稳定'];
  return ['ok','理论：稳定'];
}

const LANES=[

// 对照时，间隙和电流两栏按电路曲线的实际范围自动缩放，细小的差别也看得清
function niceTicks(lo,hi){ const raw=(hi-lo)/3, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p, step=(m<1.5?1:m<3?2:m<7?5:10)*p;
  const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(+v.toFixed(6)); return out; }
function laneFor(ln,ov){
  if(!ov||ln.key==='v') return ln;
  const arr=ov.data[OV_KEY[ln.key]]; let lo=Infinity, hi=-Infinity;
  for(const v of arr){ if(v<lo) lo=v; if(v>hi) hi=v; }
  if(ln.key==='x'){ lo=Math.max(lo,0); hi=Math.min(hi,46); }
  const span=Math.max(hi-lo, ln.key==='x'?2:0.2), mid=(lo+hi)/2;

  if(ov){
    // 动作时刻的竖线，时间轴改成"动作后多少秒"
    const xa=X(ov.tAction);
    if(xa>=L&&xa<=L+pw){ c.strokeStyle=T.copper; c.setLineDash([3,3]); c.beginPath(); c.moveTo(xa+0.5,TOP); c.lineTo(xa+0.5,H-BOT); c.stroke(); c.setLineDash([]); }
    for(let k=0;k<=4;k++){ const rel=t0+span*k/4-ov.tAction; c.fillText((Math.abs(rel)<1e-9?'动作':(rel>0?'+':'−')+Math.abs(rel).toFixed(2)+' s'), L+pw*k/4, H-5); }
  } else {
    for(let k=0;k<=4;k++){ c.fillText((k===4?'现在':'−'+(2-k*0.5).toFixed(1)+' s'), L+pw*k/4, H-5); }

/* ---------- 电路对照：不对照 / 预存电路 / 实时电路 ----------

   实时：把当前参数发给本地服务 sim/server.py，让它当场跑一遍 LTspice（约 5 秒）。 */
const CIRC=window.MAGLEV_CIRCUIT||null;
// 实时电路只能用在"由本地服务 sim/server.py 打开的网页"上（出于安全考虑，服务不接受别处来的请求）
const ON_HTTP=location.protocol.startsWith('http');

const circ={mode:'off', overlay:null, server:null, busy:false, lastAction:'release', pingTimer:0};
function circSetStatus(cls,text){ const el=$('#circ-status'); el.className='circ-status'+(cls?' '+cls:''); el.textContent=text; }
function circDefaultStatus(){
  if(circ.overlay||circ.busy) return;
  if(circ.mode==='off') circSetStatus('','打开"预存电路"或"实时电路"后，做"放手、推一下、加重物、关断驱动"时会叠加电路仿真曲线。');
  else if(circ.mode==='stored') CIRC ? circSetStatus('',`已加载 ${Object.keys(CIRC.scenarios).length} 个预存场景（${CIRC.source}）。现在做一个实验试试。`)
                                     : circSetStatus('bad','没有找到预存的电路数据 demo/data/circuit.js，请先在项目文件夹里运行 python sim/export_web.py。');
  else if(circ.server===true) circSetStatus('ok','已连接本地服务。做实验时，LTspice 会按当前参数重算一遍（约 6 秒）。');
  else if(circ.server===false) circSetStatus('bad','实时电路要从本地服务打开网页：在项目文件夹里运行 python sim/server.py --open，它会自动打开 http://127.0.0.1:8766/。');
  else circSetStatus('','正在检测本地服务…');
}
function syncCircUi(){
  document.querySelectorAll('#circ-mode [data-circ]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.circ===circ.mode?'true':'false'));

function setOverlay(o){

  $('#scope-title').textContent=`示波器 · 对照：${o.title}（${o.source==='stored'?'预存':'实时'} LTspice）`;
  const m=o.data.metrics||{}, parts=[];

  if(m.max_abs_displacement_mm!=null) parts.push(`最大偏移 ${m.max_abs_displacement_mm.toFixed(2)} mm`);
  if(m.steady_state_error_mm!=null) parts.push(`稳态误差 ${m.steady_state_error_mm.toFixed(3)} mm`);
  const state={stable:'稳定',fallen:'落地',falling:'正在掉落',stuck:'被吸住',damaged:'损坏',oscillation:'振荡',unsettled:'未稳定'}[o.data.final_state]||o.data.final_state;
  const head=(o.source==='stored'?'白色虚线是事先用 LTspice 跑好的电路仿真':`白色虚线是 LTspice 刚刚按当前参数算出的电路仿真（用时 ${(o.data.elapsed_s||0).toFixed(1)} s）`)+`，结果：${state}。`;

function clearOverlay(){ circ.overlay=null; $('#lg-circ').hidden=true; $('#scope-title').textContent='示波器 · 最近 2 秒'; circDefaultStatus(); }
function setCircMode(m){

  clearInterval(circ.pingTimer);
  if(m==='live'){ pingServer(); circ.pingTimer=setInterval(()=>{ if(circ.server!==true) pingServer(); },5000); }

async function pingServer(){
  if(!ON_HTTP){ circ.server=false; circDefaultStatus(); return; }   // 双击打开的网页用不了实时电路
  try{
    const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),1500);
    const r=await fetch('/api/ping',{signal:ctl.signal,cache:'no-store'}); clearTimeout(tm);
    const j=await r.json(); circ.server=!!(r.ok&&j.ok&&j.ltspice);
  }catch(err){ circ.server=false; }
  circDefaultStatus();
}
const sameGains=(a,b)=>Math.abs(a.Kp-b.Kp)<1e-6 && Math.abs(a.Ki-b.Ki)<1e-6 && Math.abs(a.Kd-b.Kd)<6e-4 && a.integral_on===b.integral_on && a.diode===b.diode;
// 每次做实验时调用：pre 是动作之前的状态，用来判断和电路场景的起点是否一致
function circuitOnAction(name,pre){
  if(circ.mode==='off') return;
  const kind= name==='release'?'release' : name==='push'?'push' : (name==='weight'&&sim.massRatio>0)?'load' : (name==='drive'&&!sim.drive)?'drive_off' : null;
  if(!kind){ if(['weight','feedback','drive','diode','integral'].includes(name)) clearOverlay(); return; }
  circ.lastAction=kind;
  const req={action:kind, Kp:sim.gain.Kp, Ki:sim.gain.Ki, Kd:sim.gain.Kd, integral_on:sim.integral, diode:sim.diode};
  const notes=[], x0=PARAMS.plant.x0_m;
  if(!pre.feedback) notes.push('反馈处于断开状态，电路里没有这种情况');
  if(kind!=='release' && (Math.abs(pre.x-x0)>0.15e-3 || Math.abs(pre.v)>0.005)) notes.push('动作前球还没稳在 10 mm');
  if(pre.mass>0) notes.push('动作前已经挂着重物');
  if(circ.mode==='stored') showStored(kind,req,sim.t,notes); else requestLive(kind,req,sim.t,notes);
}
function showStored(kind,req,tAction,notes){
  if(!CIRC){ circDefaultStatus(); return; }
  let best=null;
  for(const sc of Object.values(CIRC.scenarios)){
    if(sc.request.action!==kind || !sameGains(req,sc.request)) continue;
    const d=Math.abs(req.Kd-sc.request.Kd); if(!best||d<best.d) best={sc,d};
  }
  if(!best){ clearOverlay(); circSetStatus('warn',`预存数据里没有当前这组参数的"${KIND_NAMES[kind]}"。切到"实时电路"，可以让电路按当前参数重算。`); return; }
  if(best.d>1e-6) notes.push(`预存曲线用的 Kd = ${best.sc.request.Kd.toFixed(4)} s，和当前略有不同`);
  if(CIRC.params_digest && window.MAGLEV_PARAMS_DIGEST && CIRC.params_digest!==window.MAGLEV_PARAMS_DIGEST) notes.push('预存数据是用旧参数生成的，请重新运行 python sim/export_web.py');
  setOverlay({source:'stored', title:best.sc.title, data:best.sc, tAction, notes});
}
async function requestLive(kind,req,tAction,notes){
  if(circ.server!==true){ await pingServer(); if(circ.server!==true) return; }
  if(circ.busy){ circSetStatus('warn','电路还在仿真上一个动作，请稍候再试。'); return; }
  circ.busy=true; circ.overlay=null; $('#lg-circ').hidden=true;
  circSetStatus('',`电路仿真中：${KIND_NAMES[kind]}（Kp ${req.Kp}，Ki ${req.Ki} /s，Kd ${req.Kd} s），大约需要 6 秒…`);
  try{
    const r=await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});
    const j=await r.json().catch(()=>({ok:false,error:'本地服务返回的内容无法解析'}));
    if(!r.ok||!j.ok) throw new Error(j.busy?'本地服务正忙，请稍候再试':(j.error||('HTTP '+r.status)));
    circ.busy=false;
    if(circ.mode==='live') setOverlay({source:'live', title:j.title||KIND_NAMES[kind], data:j, tAction, notes});
  }catch(err){
    circ.busy=false;
    circSetStatus('bad','电路仿真没有完成：'+String(err.message||err).split('\n')[0]);
    if(err instanceof TypeError) circ.server=false;   // 网络错误，多半是服务被关掉了
  }
}

function drawMap(){
  if(!mctx) return;
  const c=mctx, W=MW, H=MH, L=40, B=28, TP=8, RP=10, pw=W-L-RP, ph=H-TP-B;
  const KPM=10, KDM=0.15, X=(kp)=>L+kp/KPM*pw, Y=(kd)=>TP+ph-kd/KDM*ph;
  const {a,c:cc}=sim.D, Ki=sim.integral?sim.gain.Ki:0, kp0=a/cc;
  c.clearRect(0,0,W,H);
  c.fillStyle=T.grid; c.fillRect(L,TP,pw,ph);
  // 稳定区
  const pts=[]; for(let k=0;k<=120;k++){ const kp=kp0+(KPM-kp0)*k/120; const kd= Ki>0 ? Ki/(cc*kp-a) : 0; pts.push([kp,Math.min(kd,KDM)]); }
  c.beginPath(); c.moveTo(X(kp0),Y(KDM)); for(const [kp,kd] of pts) c.lineTo(X(kp),Y(kd)); c.lineTo(X(KPM),Y(KDM)); c.closePath();
  c.fillStyle=T.ok; c.globalAlpha=0.2; c.fill(); c.globalAlpha=1;
  c.strokeStyle=T.ok; c.lineWidth=1.6; c.beginPath(); c.moveTo(X(kp0),Y(KDM)); for(const [kp,kd] of pts) c.lineTo(X(kp),Y(kd)); c.stroke();
  c.fillStyle=T.ok; c.font='600 12px '+getFont(); c.textAlign='left'; c.fillText('稳定',X(6.6),Y(0.112));
  c.fillStyle=T.bad; c.fillText('不稳定',X(0.15),Y(0.02));
  // 坐标轴
  c.fillStyle=T.muted; c.font='10.5px '+getNumFont(); c.textAlign='center';
  for(const kp of [0,2,4,6,8,10]) c.fillText(String(kp),X(kp),H-B+14);
  c.fillText('Kp',L+pw/2,H-3);
  c.textAlign='right'; for(const kd of [0,0.05,0.1,0.15]) c.fillText(kd.toFixed(2),L-5,Y(kd)+3.5);
  c.save(); c.translate(10,TP+ph/2); c.rotate(-Math.PI/2); c.textAlign='center'; c.fillText('Kd（s）',0,0); c.restore();
  // 当前点
  const px=X(clamp(sim.gain.Kp,0,KPM)), py=Y(clamp(sim.gain.Kd,0,KDM));
  c.fillStyle=T.panel; c.beginPath(); c.arc(px,py,7,0,Math.PI*2); c.fill();
  c.fillStyle=sim.feedback?T.ink:T.muted; c.beginPath(); c.arc(px,py,4.5,0,Math.PI*2); c.fill();

}

function status(){
  if(sim.damaged) return ['bad','三极管击穿'];
  if(sim.fallen) return ['bad','已掉落'];
  if(sim.stuck) return ['bad','被吸住'];
  let a1=[1e9,-1e9], a2=[1e9,-1e9];
  const tn=sim.t;
  eachSample((t,x)=>{ if(t>tn-0.2){ a2[0]=Math.min(a2[0],x); a2[1]=Math.max(a2[1],x); } else if(t>tn-0.4){ a1[0]=Math.min(a1[0],x); a1[1]=Math.max(a1[1],x); } });
  const amp2=a2[1]-a2[0], amp1=a1[1]-a1[0], dev=sim.s.x*1000-PARAMS.plant.x0_m*1000;
  if(!sim.feedback) return ['bad','失去平衡'];
  const since=tn-Math.max(sim.lastEventT,sim.pushUntil);   // 刚操作过的一小段时间里，摆幅变大是正常的
  if(since>0.35 && amp2>0.3 && amp1>0 && amp2>amp1*1.15) return ['bad','振荡加剧'];
  if(Math.max(amp1,amp2)<0.08 && since>0.05){
    if(Math.abs(dev)<0.05) return ['ok','稳定悬浮'];
    return ['ok','稳定，'+(dev>0?'偏低 ':'偏高 ')+Math.abs(dev).toFixed(2)+' mm'];
  }
  return ['warn','恢复中'];
}

  // 星云天空：沿一条倾斜的"银河带"分布的柔光团 + 细密星尘
  const skyTex=canvasTex(2048,1024,(g,W,H)=>{

  const earthTex=canvasTex(1024,512,(g,W,H)=>{

  const arrow=new TH.ArrowHelper(V(0,-1,0),V(0,0,0),26,0xdfe8ff,8,5); arrow.visible=false; scene.add(arrow);

  // ---------- 底座上的电路板：4 片运放、积分/微分电容、设定电位器、采样电阻、续流二极管 ----------
  const pcb=new TH.Group(); pcb.position.set(-52,BASE_TOP,30); scene.add(pcb);

  const glow=glowSprite(0xff8a2a,18,0); glow.position.set(-60,BASE_TOP+3.5,45);

  // 散热器 + TO-3 封装的功率三极管 2N3055
  const hs=new TH.Group(); hs.position.set(42,BASE_TOP,34); scene.add(hs);
  add(new TH.BoxGeometry(36,3,32),M.sink,0,1.5,0,hs);
  for(let q=0;q<8;q++) add(new TH.BoxGeometry(1.6,16,13),M.sink,-15.4+q*4.4,11,8.5,hs);
  add(new TH.CylinderGeometry(12,12,1.4,40),M.steel,0,3.7,-7,hs).scale.set(1.4,1,0.72);
  add(new TH.CylinderGeometry(8.5,8.5,7.5,40),canMat,0,8.1,-7,hs);
  const canWorld=V(42,BASE_TOP+12,27);

  // 线圈引线：沿横臂和立柱走到三极管
  const wire=(pts,mat)=>{ const c=new TH.CatmullRomCurve3(pts.map(p=>V(p[0],p[1],p[2]))); add(new TH.TubeGeometry(c,90,0.9,8,false),mat,0,0,0); };
  wire([[19,20,8],[28,36,10],[50,38,10],[72,34,10],[72,-60,10],[71,-100,12],[60,-103.8,24],[46,-103.8,28]],M.wireR);
  wire([[18,12,10],[27,32,12.5],[50,35,12.5],[75,30,12.5],[75,-60,12.5],[74,-100,14],[52,-103.8,30],[36,-103.8,27]],M.wireK);

  // 击穿时的火花和烟
  const NS=60, spPos=new Float32Array(NS*3).fill(9999), spVel=new Float32Array(NS*3), spLife=new Float32Array(NS);
  const spGeo=new TH.BufferGeometry(); spGeo.setAttribute('position',new TH.BufferAttribute(spPos,3));
  const sparks=new TH.Points(spGeo,new TH.PointsMaterial({color:0xffb347,size:3,map:dotTex,transparent:true,depthWrite:false,blending:ADD,fog:false}));
  sparks.frustumCulled=false; scene.add(sparks);
  const flash=glowSprite(0xff7a2a,90,0); flash.position.copy(canWorld);
  const smoke=[]; for(let q=0;q<10;q++){ const sp=new TH.Sprite(new TH.SpriteMaterial({map:dotTex,color:0x55606e,transparent:true,opacity:0,depthWrite:false})); sp.visible=false; scene.add(sp); smoke.push({sp,life:0,delay:0}); }
  let flashT=0;
  function burst(){
    for(let q=0;q<NS;q++){ spPos.set([canWorld.x,canWorld.y,canWorld.z],q*3); spVel.set([(Math.random()-0.5)*180,60+Math.random()*170,(Math.random()-0.5)*180],q*3); spLife[q]=0.4+Math.random()*0.6; }
    smoke.forEach((m,q)=>{ m.life=3; m.delay=q*0.15; m.sp.position.copy(canWorld); m.sp.visible=true; });
    flashT=0.5;
  }

  // ---------- 标注 ----------
  const LAB=[
    {id:'coil',cls:'left',text:'电磁铁线圈',at:()=>[-23,20,0]},
    {id:'hall',cls:'right',text:'霍尔传感器',at:()=>[3,-1,2]},
    {id:'target',cls:'left',text:'目标高度',at:()=>[-38,-(10+R),0]},
    {id:'tr',cls:'up',text:'功率三极管',at:()=>[42,BASE_TOP+13,27]},
    {id:'dio',cls:'left',text:'续流二极管',at:()=>[-62,BASE_TOP+4,45]},
    {id:'op',cls:'up',text:'运放 PID 电路',at:()=>[-45,BASE_TOP+7,19]},
    {id:'rs',cls:'right',text:'采样电阻 1 Ω',at:()=>[-36,BASE_TOP+4,42]}
  ];
  const labs={}; for(const L of LAB){ const el=document.createElement('div'); el.className='l3 '+L.cls; el.innerHTML='<i></i><span></span>'; el.lastChild.textContent=L.text; labelHost.appendChild(el); labs[L.id]={...L,el,span:el.lastChild}; }
  let labelsOn=true;

  // ---------- 视角：拖动旋转、预设视角平滑过渡、空闲时镜头缓慢漂移 ----------
  const PRESET={ angle:{az:0.62,el:0.24,dist:470,tx:0,ty:-42,tz:10}, front:{az:0,el:0.08,dist:450,tx:0,ty:-40,tz:0}, board:{az:0.18,el:0.72,dist:260,tx:-5,ty:-100,tz:30} };
  const view={...PRESET.angle}, goal={...PRESET.angle};
  let drag=null, lastTouch=performance.now();
  cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY}; lastTouch=performance.now(); cv.setPointerCapture(e.pointerId); cv.focus({preventScroll:true}); });
  cv.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; lastTouch=performance.now();
    goal.az-=dx*0.008; goal.el=clamp(goal.el+dy*0.006,-0.05,1.25); view.az=goal.az; view.el=goal.el; });
  const endDrag=()=>{ drag=null; }; cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);
  cv.addEventListener('wheel',e=>{ if(document.activeElement!==cv) return; e.preventDefault(); lastTouch=performance.now(); goal.dist=clamp(goal.dist*Math.exp(e.deltaY*0.001),160,800); },{passive:false});
  cv.addEventListener('dblclick',()=>setView('angle'));
  function setView(name){ Object.assign(goal,PRESET[name]); lastTouch=performance.now();
    document.querySelectorAll('#views [data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===name?'true':'false')); }
  document.querySelectorAll('#views [data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

  // 面板挡住的区域：用视口偏移把模型移到剩下空间的正中
  const ins={l:0,r:0,t:0,b:0}, insC={l:0,r:0,t:0,b:0};
  function setInsets(o){ Object.assign(ins,o); }

  let W=1,H=1;
  new ResizeObserver(()=>{ const w=host.clientWidth, h=host.clientHeight; if(!w||!h) return; W=w; H=h; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }).observe(host);

  let prevDamaged=false, flow=0, lastLab=0;
  const tmp=new TH.Vector3();
  function render(rdt,active,now){
    const s=sim.s, o=sim.out, p=PARAMS.plant, d=PARAMS.driver;
    // 显示位置：目标附近把间隙变化放大约 3 倍，远处恢复 1:1，保证不会穿过电磁铁或底座
    const dd=s.x*1000-p.x0_m*1000;
    const disp=clamp(p.x0_m*1000+dd*(1+2*Math.exp(-dd*dd/6.25)), p.x_contact_m*1000, p.x_floor_m*1000-(sim.massRatio>0?6.6:0));
    const cy=-(disp+R);
    G.position.y=cy; globe.rotation.y=rot; clouds.rotation.y=rot*1.25+0.6; weight.visible=sim.massRatio>0;
    const lift=(cy-R)-BASE_TOP, near=clamp(1-lift/70,0,1);
    blob.scale.setScalar(44+46*(1-near)); blob.material.opacity=0.1+0.45*near;
    space.rotation.y+=rdt*0.004; starMat.uniforms.time.value=now/1000;

    // 线圈发光，亮度随电流
    const lvl=clamp(s.i/1.1,0,1);
    coilMat.emissiveIntensity=0.05+1.2*lvl*lvl; coilLight.intensity=2.2*lvl; halo.material.opacity=0.34*lvl*lvl;

    // 磁感线和粒子，浓淡随磁力
    const show=disp>2.6 && s.i>0.01;
    const st=Math.min(1,o.F/(p.m_kg*(1+sim.massRatio)*p.g_m_per_s2));
    fieldMat.opacity=0.12+0.5*st; partMat.opacity=0.25+0.75*st; poleGlow.material.opacity=show?0.45*st:0;
    if(active) flow+=rdt*(0.25+0.6*clamp(s.i/0.6,0,2));
    const pp=partGeo.attributes.position.array;
    for(let k=0;k<NC;k++){
      const P=curve(k,cy), arr=lines[k].geometry.attributes.position.array;
      for(let j=0;j<NP;j++) bez(P,j/(NP-1),arr,j*3);
      lines[k].geometry.attributes.position.needsUpdate=true; lines[k].visible=show;
      for(let q=0;q<NQ;q++){ const t=(flow+q/NQ+k*0.37)%1; bez(P,t,pp,(k*NQ+q)*3); }
    }
    partGeo.attributes.position.needsUpdate=true; parts.visible=show;

    // 续流二极管导通时发光；拆掉后不显示
    const diodeOn=sim.diode && o.Vc<0 && s.i>1e-4;
    dio.visible=band.visible=sim.diode;
    diodeMat.emissiveIntensity=diodeOn?2:0; glow.material.opacity=diodeOn?0.55+0.4*clamp(s.i/0.6,0,1):0;
    const Pt=diodeOn?0:Math.max(0,(d.Vs_V-o.Vc)*s.i);

    // 三极管击穿：闪光、火花、烟、外壳烧黑
    if(sim.damaged&&!prevDamaged){ burst(); canMat.color.set(0x2a2522); canMat.roughness=0.9; canMat.metalness=0.2; }
    if(!sim.damaged&&prevDamaged){ canMat.color.set(0xc9cdd3); canMat.roughness=0.26; canMat.metalness=0.95; }
    prevDamaged=sim.damaged;
    flashT=Math.max(0,flashT-rdt); flash.material.opacity=flashT>0?Math.min(1,flashT*3):0;
    for(let q=0;q<NS;q++){ if(spLife[q]<=0) continue; spLife[q]-=rdt; spVel[q*3+1]-=600*rdt;
      spPos[q*3]+=spVel[q*3]*rdt; spPos[q*3+1]+=spVel[q*3+1]*rdt; spPos[q*3+2]+=spVel[q*3+2]*rdt; if(spLife[q]<=0) spPos[q*3+1]=9999; }
    spGeo.attributes.position.needsUpdate=true;
    smoke.forEach((m,q)=>{ if(m.life<=0) return; if(m.delay>0){ m.delay-=rdt; return; } m.life-=rdt; const a=1-m.life/3;
      m.sp.position.set(canWorld.x+Math.sin(a*6+q)*4, canWorld.y+4+a*45, canWorld.z); m.sp.scale.setScalar(6+a*22); m.sp.material.opacity=0.4*(1-a); if(m.life<=0) m.sp.visible=false; });

    // 推力箭头
    arrow.visible=sim.t<sim.pushUntil+0.06; arrow.position.set(R+14,cy+34,0);

    // 相机：平滑跟随目标视角；没人操作 5 秒后开始缓慢漂移
    const k=1-Math.exp(-rdt*7); for(const key in view) view[key]+=(goal[key]-view[key])*k;
    for(const key in ins) insC[key]+=(ins[key]-insC[key])*k;
    const idle=clamp((now-lastTouch-5000)/5000,0,1);
    const az=view.az+idle*0.1*Math.sin(now/7000), el=view.el+idle*0.025*Math.sin(now/9000), ce=Math.cos(el);
    // 被面板挡住得越多，镜头退得越远，保证模型完整落在空白区域里
    const freeH=Math.max(0.45,(H-insC.t-insC.b)/H), freeW=Math.max(0.45,(W-insC.l-insC.r)/W);
    const dist=view.dist/Math.min(freeH,freeW*W/H/1.25,1);
    cam.position.set(view.tx+dist*ce*Math.sin(az), view.ty+dist*Math.sin(el), view.tz+dist*ce*Math.cos(az));
    cam.lookAt(view.tx,view.ty,view.tz);
    cam.setViewOffset(W,H,(insC.r-insC.l)/2,(insC.b-insC.t)/2,W,H);
    renderer.render(scene,cam);

    // 标注跟随三维位置
    if(!labelsOn) return;
    for(const id in labs){ const L=labs[id], [x,y,z]=L.at(); tmp.set(x,y,z).project(cam);
      if(tmp.z>1||Math.abs(tmp.x)>1.05||Math.abs(tmp.y)>1.05){ L.el.style.visibility='hidden'; continue; }
      L.el.style.visibility='visible'; L.el.style.transform=`translate(${((tmp.x+1)/2*W).toFixed(1)}px,${((1-tmp.y)/2*H).toFixed(1)}px)`; }
    if(now-lastLab>120){ lastLab=now;
      labs.coil.span.textContent=`电磁铁线圈 · ${s.i.toFixed(2)} A`;
      labs.tr.span.textContent=sim.damaged?'功率三极管 · 已击穿':`功率三极管 2N3055 · ${Pt.toFixed(1)} W`;
      labs.dio.span.textContent=!sim.diode?'续流二极管 · 已拆除':(diodeOn?'续流二极管 · 导通':'续流二极管'); }
  }
  function setLabels(on){ labelsOn=on; labelHost.classList.toggle('off',!on); }
  return {render,setLabels,setInsets,renderer,scene,cam};
}

/* ---------- 主循环 ---------- */
let fpsCount=0, fpsT0=0;
function frame(now){
  // 上限放宽到 0.25 s：电脑卡顿时画面不连贯，但仿真时间照常推进
  const rdt=Math.min(0.25,(now-lastNow)/1000); lastNow=now;
  fpsCount++; if(now-fpsT0>2000){ const fps=fpsCount*1000/(now-fpsT0); const h=$('#fps-hint');
    h.hidden=!(use3d&&fps<12); h.textContent=`画面卡顿（约 ${Math.max(1,Math.round(fps))} 帧/秒），可以切换到平面`;
    if(use3d&&fps<20) document.body.classList.add('lowfx');   // 电脑带不动时关掉面板的毛玻璃效果
    fpsCount=0; fpsT0=now; }
  if(!paused){
    const h=1e-4, n=Math.round(rdt*speed/h);
    for(let k=0;k<n;k++){
      sim.noiseF += -sim.noiseF*h/NOISE_TAU + NOISE_SIGMA*Math.sqrt(2*h/NOISE_TAU)*randn();
      sim.step(h);
      if(sim.t>=nextSample){ record(); nextSample=sim.t+0.001; }
    }
    rot+=rdt*0.5;
    phase+=rdt*(8+30*clamp(sim.s.i/0.6,0,2));
  }
  if(use3d) stage3d.render(rdt,!paused,now); else drawStage();
  drawScope(); updateUi(now);
  requestAnimationFrame(frame);
}

function onTheme(){ readTokens(); drawMap(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',onTheme);
new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// 能显示三维就用三维舞台，否则退回平面舞台；演示者也可以手动切换，选择会被记住
stage3d=createStage3D($('#stage3d'),$('#labels3d'));
let use3d=false;
function setMode(m){
  use3d = m==='3d' && !!stage3d;
  $('#stage3d').hidden=!use3d; stageCv.hidden=use3d;
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.mode===(use3d?'3d':'2d'))?'true':'false'));
  if(!use3d){ fit(); $('#fps-hint').hidden=true; }
  try{ localStorage.setItem('maglev-mode',use3d?'3d':'2d'); }catch(err){}
}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
if(stage3d){
  $('#b-labels').onclick=()=>{ const on=$('#b-labels').getAttribute('aria-pressed')!=='true'; $('#b-labels').setAttribute('aria-pressed',on?'true':'false'); stage3d.setLabels(on); };
} else { document.querySelector('[data-mode="3d"]').disabled=true; }
let savedMode=null; try{ savedMode=localStorage.getItem('maglev-mode'); }catch(err){}
setMode(savedMode==='2d'?'2d':'3d');
if(matchMedia('(max-width:1199px)').matches) setPanel(false);   // 屏幕不够宽时默认收起参数面板，把空间留给模型

// 电路对照的三档开关；默认"不对照"，上次的选择会被记住
document.querySelectorAll('#circ-mode [data-circ]').forEach(b=>b.onclick=()=>setCircMode(b.dataset.circ));
$('#b-redo').onclick=()=>redoCompare();
{ let saved='off'; try{ saved=localStorage.getItem('maglev-circuit')||'off'; }catch(err){}
  if(saved==='stored'&&!CIRC) saved='off';
  setCircMode(['off','stored','live'].includes(saved)?saved:'off'); }

syncKnobs(); fit(); syncButtons(); setSpeed(0.25);
requestAnimationFrame((t)=>{ lastNow=t; requestAnimationFrame(frame); });
</script>
